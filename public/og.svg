<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041F20" />
      <stop offset="40%" stop-color="#08383A" />
      <stop offset="100%" stop-color="#021415" />
    </linearGradient>

    <!-- Subtle Grid Background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#086B6D" stroke-width="1" stroke-opacity="0.15" />
    </pattern>

    <radialGradient id="radial-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#041F20" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#radial-glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Card Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#06282A" fill-opacity="0.6" stroke="#0D9488" stroke-opacity="0.3" stroke-width="2" />

  <!-- Top Badge: Curated AI Discovery Engine -->
  <g transform="translate(600, 110)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#086B6D" fill-opacity="0.3" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.5" />
    <text text-anchor="middle" y="6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2DD4BF" letter-spacing="2">CURATED AI TOOLS &amp; AGENT SKILLS</text>
  </g>

  <!-- Center Findry Logo Brand Mark + Name -->
  <g transform="translate(340, 180)">
    <!-- Logo Icon -->
    <g transform="scale(0.24)">
      <defs>
        <mask id="og-logo-mask">
          <rect width="512" height="512" fill="white" />
          <path
            d="M48 512C58 451 104 403 165 350C213 308 228 270 205 228C192 204 162 190 162 161C162 111 235 97 326 97V54L436 121L326 210V168C275 168 232 178 232 207C232 225 263 240 282 267C320 322 294 374 246 421C207 460 188 485 185 512Z"
            fill="black"
          />
        </mask>
      </defs>
      <path
        d="M100 16H476C496 16 512 32 512 52V101C512 140 481 171 442 171H426V257C426 292 400 320 365 326C325 331 301 349 301 387V488C301 501 290 512 277 512H48V68C48 39 71 16 100 16Z"
        fill="#2DD4BF"
        mask="url(#og-logo-mask)"
      />
    </g>

    <!-- Typography -->
    <text x="145" y="90" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF" letter-spacing="-2">Findry<tspan fill="#38BDF8"> AI</tspan></text>
  </g>

  <!-- Tagline / Headline -->
  <text x="600" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#E2E8F0" letter-spacing="-0.5">
    Discover Curated AI Tools for Every Workflow
  </text>

  <!-- Subtitle -->
  <text x="600" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#94A3B8">
    Hand-picked tools, verified links, smart alternatives &amp; daily agent intelligence
  </text>

  <!-- Bottom Badges / Tags -->
  <g transform="translate(600, 480)">
    <!-- Tag 1 -->
    <g transform="translate(-330, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0F3D3E" stroke="#14B8A6" stroke-width="1" />
      <text text-anchor="middle" y="6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5EEAD4">1,000+ Tools</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(-110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0F3D3E" stroke="#14B8A6" stroke-width="1" />
      <text text-anchor="middle" y="6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5EEAD4">Smart Alternatives</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0F3D3E" stroke="#14B8A6" stroke-width="1" />
      <text text-anchor="middle" y="6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5EEAD4">Agent Skills</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(330, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0F3D3E" stroke="#14B8A6" stroke-width="1" />
      <text text-anchor="middle" y="6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5EEAD4">Zero Broken Links</text>
    </g>
  </g>

  <!-- Footer domain watermark -->
  <text x="600" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#64748B" letter-spacing="1">
    findryai.com
  </text>
</svg>